name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish Python distributions to PyPI after building release artifacts.
        type: boolean
        default: false

jobs:
  build-mcpb:
    name: Build Claude Desktop MCPB
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.versions.outputs.package_version }}
      asset_name: ${{ steps.versions.outputs.asset_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb
      - name: Install smoke-test dependencies
        run: python -m pip install -e .
      - name: Check release versions
        id: versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $manifest = Get-Content packaging\claude-mcpb\manifest.json -Raw | ConvertFrom-Json
          $pyprojectVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($manifest.version -ne $pyprojectVersion) {
            throw "MCPB manifest version $($manifest.version) does not match pyproject version $pyprojectVersion"
          }
          if ($env:RELEASE_TAG) {
            $tagVersion = $env:RELEASE_TAG -replace '^v', ''
            if ($tagVersion -ne $manifest.version) {
              throw "Release tag $env:RELEASE_TAG does not match package version $($manifest.version)"
            }
          }
          "package_version=$($manifest.version)" >> $env:GITHUB_OUTPUT
          "asset_name=maya-mcp-$($manifest.version).mcpb" >> $env:GITHUB_OUTPUT
      - name: Build MCPB package
        shell: pwsh
        run: .\packaging\claude-mcpb\build.ps1
      - name: Inspect MCPB package
        shell: pwsh
        run: |
          mcpb validate dist\mcpb\maya-mcp\manifest.json
          mcpb info dist\mcpb\maya-mcp\maya-mcp.mcpb
      - name: Smoke test MCPB package
        shell: pwsh
        run: |
          mcpb unpack dist\mcpb\maya-mcp\maya-mcp.mcpb dist\mcpb-smoke
          python packaging\claude-mcpb\smoke_test.py dist\mcpb-smoke --expected-tools 71
      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\release | Out-Null
          Copy-Item dist\mcpb\maya-mcp\maya-mcp.mcpb "dist\release\${{ steps.versions.outputs.asset_name }}"
      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-mcpb-${{ steps.versions.outputs.package_version }}
          path: dist/release/${{ steps.versions.outputs.asset_name }}
  attach-mcpb-release:
    name: Attach MCPB to GitHub Release
    needs: build-mcpb
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download MCPB artifact
        uses: actions/download-artifact@v4
        with:
          name: claude-desktop-mcpb-${{ needs.build-mcpb.outputs.package_version }}
          path: dist/release
      - name: Attach MCPB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/${{ needs.build-mcpb.outputs.asset_name }}

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build, build-mcpb]
    if: github.event_name == 'release' || github.event.inputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/maya-mcp
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to Official MCP Registry
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check registry release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(jq -r '.version' server.json)" = "$version"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
      - name: Wait for PyPI ownership metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in {1..12}; do
            if VERSION="$version" python - <<'PY'
          import json
          import os
          import urllib.request

          url = f"https://pypi.org/pypi/maya-mcp/{os.environ['VERSION']}/json"
          with urllib.request.urlopen(url, timeout=15) as response:
              package = json.load(response)

          assert package["info"]["version"] == os.environ["VERSION"]
          assert "mcp-name: io.github.GimbalGoats/maya-mcp" in package["info"]["description"]
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "PyPI did not expose the release and MCP ownership marker in time" >&2
          exit 1
      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl --fail --show-error --silent --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate to Official MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata
        run: ./mcp-publisher publish
